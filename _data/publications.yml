# HOW TO ADD A PUBLICATION
#   Copy an existing entry, paste it at the top of the list (newest first)
#   and edit the fields. Keep the two-space indentation and the quotes.
#
#   - year: 2026                      # required, decides the year heading
#     authors: "Novak, P., Macas, J."   # required
#     title: "Title of the paper"       # required, no trailing period
#     venue: "*Journal* **12**: 1-10."  # optional, journal / volume / pages
#     url: "https://doi.org/10.xxxx"    # optional, link on the title
#     pdf: "Novak_Journal_2026.pdf"     # optional, file placed in lamc/publ/
#
#   Text may use Markdown: *italic*, **bold**, [link text](https://...).
#   If both url and pdf are given, the title links to url and a [PDF] link
#   is added. Entries with year <= 1997 are shown in a single
#   "selected publications" section (see pubs_selected_before in _config.yml).

